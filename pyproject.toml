[project]
name = "investment-research-hub"
version = "0.1.0"
description = "Shared investment research and exact portfolio accounting"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "defusedxml>=0.7.1,<1",
  "tzdata>=2026.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.126,<7", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/hub_api", "packages/engines/src/hub_finance"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hub_finance"]
